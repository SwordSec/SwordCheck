name: Feature request
description: A new check, a new source, or a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
      description: >
        Keep in mind that SwordCheck is read-only by design: it reports and recommends,
        it never changes a setting.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing tools that already do this
