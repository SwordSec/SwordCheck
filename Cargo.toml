[package]
name = "macos-audit"
version = "0.1.0"
edition = "2024"
description = "Yerel macOS güvenlik ayarlarını denetleyen küçük bir CLI aracı"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
