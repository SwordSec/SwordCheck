[package]
name = "swordcheck"
version = "0.1.0"
edition = "2024"
description = "SwordCheck: a read-only security check-up (settings audit, vulnerabilities, npm malware, secrets)"
authors = ["SwordSec"]
license-file = "LICENSE.md"
# Source-available, not open source: keep it off crates.io.
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3"
ratatui = "0.30.2"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
