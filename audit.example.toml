# Example configuration for macos-audit.
#
# To use it, copy this file as `audit.toml` into the project directory or to
# `~/.config/macos-audit/audit.toml`. All fields are optional. For the valid
# check ids, run: `macos-audit --list`

# The exit code is 1 if the score is below this value (handy as a threshold in CI).
min_score = 80

# Checks that are never run.
skip = ["airdrop"]

# Change the weight of checks in the score.
[weights]
filevault = 40
stealth = 2

# Deliberately accepted conditions. A check with an exception still runs and
# shows up as "EXCEPTION" in the report, but does not affect the score or the
# exit code.
[exceptions]
ssh = "Development machine; SSH is enabled on purpose"
