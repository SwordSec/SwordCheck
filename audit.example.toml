# macos-audit örnek yapılandırması.
#
# Kullanmak için bu dosyayı `audit.toml` adıyla proje dizinine ya da
# `~/.config/macos-audit/audit.toml` yoluna kopyala. Tüm alanlar isteğe
# bağlıdır. Geçerli kontrol kimlikleri için: `macos-audit --list`

# Puan bu değerin altındaysa çıkış kodu 1 olur (CI'da eşik olarak kullanışlı).
min_score = 80

# Hiç çalıştırılmayacak kontroller.
skip = ["airdrop"]

# Kontrollerin puandaki ağırlığını değiştir.
[weights]
filevault = 40
stealth = 2

# Bilerek kabul edilen durumlar. İstisnalı kontrol çalışır ve raporda
# "İSTİSNA" olarak görünür ama puana ve çıkış koduna etki etmez.
[exceptions]
ssh = "Geliştirme makinesi; SSH bilerek açık"
